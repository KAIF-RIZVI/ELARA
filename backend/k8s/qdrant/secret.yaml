apiVersion: v1
kind: Secret
metadata:
  name: qdrant-production-secrets
  namespace: elara-qdrant
type: Opaque
stringData:
  # IMPORTANT: In a real production environment, this file MUST NOT be committed to version control.
  # Use a secret manager (AWS Secrets Manager, HashiCorp Vault, SealedSecrets) to inject this value.
  # Provide a strong, cryptographically secure random string here.
  api-key: "CHANGE_ME_PRODUCTION_API_KEY_SUPER_SECRET"
